[project]
name = "nmfd-traffic-env"
version = "0.2.0"
description = "Reusable JAX environment for regional NMFD traffic control with DPC and information-theoretic MPPI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "flax==0.10.4",
    "jax==0.4.33",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "optax==0.2.5",
]

[project.scripts]
nmfd-evaluate = "nmfd_traffic.cli:evaluate_main"
nmfd-train = "nmfd_traffic.cli:train_main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nmfd_traffic = ["py.typed", "data/*.toml"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.coverage.run]
branch = true
source = ["nmfd_traffic"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
